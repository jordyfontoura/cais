name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.0"
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo "+$RUST_TOOLCHAIN" fmt --all --check
      - name: Clippy
        run: cargo "+$RUST_TOOLCHAIN" clippy --workspace --all-targets --locked -- -D warnings
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Build
        shell: bash
        run: cargo "+$RUST_TOOLCHAIN" build --workspace --locked
      - name: Test
        shell: bash
        run: cargo "+$RUST_TOOLCHAIN" test --workspace --locked
      - name: Schemas match the Rust types
        shell: bash
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          python tools/export_schemas.py --client "target/debug/cais$suffix" --check
  client:
    # The client against the runner's own OpenSSH: real macOS and Linux, no containers.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Build client and planning server
        run: cargo "+$RUST_TOOLCHAIN" build --locked --bin cais --bin cais-server
      - name: Client journey over the system OpenSSH
        run: python3 tools/verify_client.py
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check with the minimum supported Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --workspace --locked
