name: Release
# A tag `vX.Y.Z` that matches the workspace version builds every archive and publishes a
# release. A manual run builds the same archives without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: "1.98.0"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            # Built on Debian 12 so the binaries need no glibc newer than 2.36.
            container: debian:12
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            binaries: cais cais-server cais-broker
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            binaries: cais.exe
          - runner: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            binaries: cais
          - runner: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            binaries: cais
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Install build tools in the container
        if: matrix.container
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl gcc libc6-dev
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target '${{ matrix.target }}'
          cargo "+$RUST_TOOLCHAIN" build --locked --release --workspace --target '${{ matrix.target }}'
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          stage="cais-$version-${{ matrix.name }}"
          mkdir -p "output/$stage/bin"
          for binary in ${{ matrix.binaries }}; do
            cp "target/${{ matrix.target }}/release/$binary" "output/$stage/bin/"
          done
          cp -R LICENSE NOTICE README.md SECURITY.md CONTRIBUTING.md docs examples schemas "output/$stage/"
          cd output
          if [[ '${{ matrix.name }}' == windows-* ]]; then
            7z a -bd "$stage.zip" "$stage" > /dev/null
          else
            tar -czf "$stage.tar.gz" "$stage"
          fi
          rm -r "$stage"
      - name: Attest that this workflow built the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: output/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.name }}
          path: output/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publish the archives
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          mkdir assets
          gh run download "$GITHUB_RUN_ID" --dir downloaded
          find downloaded -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} assets/ \;
          cd assets
          test "$(ls | wc -l)" -eq 4
          sha256sum -- * > SHA256SUMS
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Cais $version" "${flags[@]}" \
            --notes "Install with the quickstart in docs/QUICKSTART.md. Check each archive against SHA256SUMS. See docs/ROADMAP.md for what is planned before 1.0." \
            -- *
