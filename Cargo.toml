[workspace]
members = ["crates/cais-core", "crates/cais-protocol", "crates/cais-artifacts", "crates/cais-postgres", "crates/cais-host", "crates/cais-cli", "crates/cais-server"]
resolver = "3"

[workspace.package]
version = "0.1.0-beta.1"
repository = "https://github.com/jordyfontoura/cais"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "=1.2.3"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.11"
whoami = "2.1"
tempfile = "3.27"
flate2 = "1.1"
tar = "0.4"
fs2 = "0.4"
base64 = "0.23"
hmac = "0.13"
pbkdf2 = "0.13"
getrandom = "0.4"
rustix = { version = "1.1", features = ["process", "fs", "event", "time", "net"] }
signal-hook = "0.4"
cais-core = { path = "crates/cais-core" }
cais-protocol = { path = "crates/cais-protocol" }
cais-artifacts = { path = "crates/cais-artifacts" }
cais-host = { path = "crates/cais-host" }
cais-postgres = { path = "crates/cais-postgres" }

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
